<!-- Pricing Card -->
<div class="flex flex-col h-full w-full p-6 text-center text-gray-900 bg-white rounded-lg border border-gray-200 shadow-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white">
    <h3 class="mb-2 text-xl font-semibold">{{ object.display_sub_name }}</h3>
    {% if object.display_sub_subtitle %}
    <p class="text-sm font-light text-gray-500 dark:text-gray-400">{{ object.display_sub_subtitle }}</p>
    {% endif %}
    <div class="flex justify-center items-baseline my-6">
        <span class="mr-1 text-4xl font-extrabold">${{ object.price }}</span>
        <span class="text-base text-gray-500 dark:text-gray-400">/{{ object.interval }}</span>
    </div>
    <ul role="list" class="mb-6 space-y-3 text-left text-sm flex-grow">
        {% for feature in object.display_features_list %}
        <li class="flex items-center space-x-2">
            <svg class="flex-shrink-0 w-5 h-5 text-green-500 dark:text-green-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
            <span>{{ feature }}</span>
        </li>
        {% endfor %}
    </ul>
    <a href="#" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:text-white dark:focus:ring-blue-900">Get started</a>
</div>
